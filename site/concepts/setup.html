<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set up paperbot</title>
<link rel="icon" href="../assets/favicon-64.png" sizes="64x64" type="image/png">
<!-- Concept: the `pocketbot setup` wizard (served by the CLI on 127.0.0.1), in the pocketbot.ca look.
     Same fonts, colours, buttons and 3D device as the landing page; the e-paper shows the firmware's real frames. -->
<script>self.ModelViewerElement = { meshoptDecoderLocation: "../vendor/meshopt_decoder.js" };</script>
<script type="module" src="../vendor/model-viewer.min.js"></script>
<style>
@font-face { font-family: "Fraunces"; src: url("../fonts/Fraunces-Soft.woff2") format("woff2"); font-weight: 350 550; font-display: swap; }
@font-face { font-family: "Figtree"; src: url("../fonts/Figtree-Variable.woff2") format("woff2"); font-weight: 300 900; font-display: swap; }
:root {
  --bg: #f8f6f1; --surface: #fdfcf9; --ink: #3b3a35; --ink-2: #86837a; --line: #e7e3d9; --red: #b4472c;
  --charcoal: #3b3a35; --on-charcoal: #f8f6f1;
  --display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --body: "Figtree", ui-sans-serif, system-ui, sans-serif;
  --gutter: clamp(20px, 5vw, 64px);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
h1 { font-family: var(--display); font-weight: 370; font-variation-settings: "SOFT" 100, "WONK" 0; letter-spacing: -.02em; margin: 0;
  font-size: clamp(36px, 4.4vw, 56px); line-height: 1.05; text-wrap: balance; }

/* mock controls, not part of the page */
.mock { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px var(--gutter); border-bottom: 1px dashed var(--line); font-size: 12px; color: var(--ink-2); }
.mock button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--ink-2); }
.mock button[aria-pressed="true"] { background: var(--charcoal); color: var(--on-charcoal); border-color: var(--charcoal); }
.mock label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }

.bar { max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 22px var(--gutter); }
.wordmark { font: 500 24px/1 var(--display); font-variation-settings: "SOFT" 100; letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
.dots { display: flex; gap: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--line); transition: width .3s, background .3s; }
.dots i.on { width: 18px; background: var(--ink); }
.dots i.done { background: var(--ink-2); }

/* one column on phones: device, then the step. Two panels on wide screens, like the landing hero. */
.setup { max-width: 1280px; margin: 0 auto; padding: 0 var(--gutter) 64px; display: grid; justify-items: center; }
.stage { width: min(100%, 520px); height: min(42svh, 380px); min-height: 260px; opacity: 0; transition: opacity .6s ease; }
.stage.ready { opacity: 1; }
model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
.step { width: min(100%, 420px); display: grid; gap: 16px; text-align: center; margin-top: 8px; }
@media (min-width: 1000px) {
  .setup { min-height: calc(100svh - 110px); grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); column-gap: clamp(32px, 5vw, 80px); align-items: center; justify-items: start; }
  .step { order: -1; text-align: left; margin: 0; width: min(100%, 26rem); }
  .stage { height: min(68vh, 620px); width: 100%; }
}
.sub { margin: -4px 0 0; color: var(--ink-2); font-size: 18px; text-wrap: pretty; }
@media (min-width: 1000px) { .sub { font-size: 19px; } }

/* buttons: the landing page's charcoal pill, and its light pill for second choices */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 52px; width: 100%; padding: 0 24px; border: 0; border-radius: 999px;
  background: var(--charcoal); color: var(--on-charcoal); font: 500 16px var(--body); text-decoration: none;
  transition: translate .2s cubic-bezier(.3, 1.6, .5, 1), scale .12s ease, background .2s, box-shadow .2s; }
.btn.light { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:disabled { opacity: .35; cursor: default; }
@media (hover: hover) {
  .btn:hover:not(:disabled):not(.light) { translate: 0 -2px; background: #2f2e2a; box-shadow: 0 10px 22px -12px rgb(40 34 20 / .55); }
  .btn.light:hover:not(:disabled) { background: #fff; border-color: var(--ink-2); }
}
.btn:active:not(:disabled) { translate: 0 1px; scale: .97; transition-duration: .06s; }
.btn.busy { background: #2a2925; }
.loader { display: inline-flex; align-items: center; gap: 6px; height: 26px; }
.loader i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: hop 1.1s ease-in-out infinite; }
.loader i:nth-child(2) { animation-delay: .15s; } .loader i:nth-child(3) { animation-delay: .3s; }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-5px); opacity: 1; } }
.waiting { justify-self: center; color: var(--ink-2); }
@media (min-width: 1000px) { .waiting { justify-self: start; } }
.link { justify-self: center; border: 0; background: none; padding: 4px; color: var(--ink-2); font-size: 15px; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
@media (min-width: 1000px) { .link { justify-self: start; padding-left: 0; } }
.link:hover { color: var(--ink); }

.track { height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.track i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 3px; transition: width .35s ease; }
.tips { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; color: var(--ink-2); }

/* the landing page's card: networks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 22px 44px -28px rgb(60 52 30 / .32); overflow: hidden; text-align: left;
  animation: card .5s cubic-bezier(.3, 1.35, .45, 1) both; }
@keyframes card { from { opacity: 0; transform: translateY(10px) scale(.98); } }
.nets { list-style: none; margin: 0; padding: 0; }
.nets li + li { border-top: 1px solid var(--line); }
.net { width: 100%; display: flex; gap: 12px; align-items: center; padding: 13px 18px; border: 0; background: none; text-align: left; font-size: 16px; }
.net .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.net[aria-checked="true"] .name { font-weight: 600; }
.sig { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.sig i { width: 3px; border-radius: 1px; background: var(--line); }
.sig i:nth-child(1) { height: 3px; } .sig i:nth-child(2) { height: 6px; } .sig i:nth-child(3) { height: 9px; } .sig i:nth-child(4) { height: 12px; }
.sig.s1 i:nth-child(-n+1), .sig.s2 i:nth-child(-n+2), .sig.s3 i:nth-child(-n+3), .sig.s4 i:nth-child(-n+4) { background: var(--ink); }
.pwrow { padding: 0 18px 16px; display: grid; gap: 8px; }
.pw { width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 0 14px; font-size: 16px; outline: none; }
.pw:focus { border-color: var(--ink-2); }
.pw.bad { border-color: var(--red); }
.err { margin: 0; color: var(--red); font-size: 14.5px; }
.mini { justify-self: start; border: 0; background: none; padding: 0; color: var(--ink-2); font-size: 14px; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }

.ok { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 0; font-size: 18px; }
@media (min-width: 1000px) { .ok { justify-content: flex-start; } }
.ok svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.say { margin: 0; font: 400 clamp(22px, 2vw, 28px)/1.3 var(--display); font-variation-settings: "SOFT" 100; letter-spacing: -.015em; text-wrap: balance; }
.memo { padding: 16px 20px 18px; }
.memo .kind { display: flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink-2); }
.memo .kind svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.memo .kind time { margin-left: auto; }
.memo h3 { margin: 6px 0 0; font: 400 25px/1.2 var(--display); font-variation-settings: "SOFT" 100; letter-spacing: -.02em; }
@media (prefers-reduced-motion: reduce) { .loader i { animation: none; opacity: .7; } .card { animation: none; } }
</style>
</head>
<body>
<div class="mock"><span>Mock</span><span id="jump"></span>
  <label><input type="checkbox" id="opt-wrong"> wrong password</label>
  <label><input type="checkbox" id="opt-asleep"> board asleep</label></div>

<header class="bar"><span class="wordmark">paperbot</span><div class="dots" id="dots" aria-hidden="true"></div></header>

<main class="setup">
  <div class="stage" id="stage">
    <model-viewer id="mv" src="../assets/paperbot.glb" alt="Your paperbot"
      camera-controls disable-zoom disable-pan touch-action="pan-y" interaction-prompt="none"
      camera-orbit="4deg 84deg 0.185m" field-of-view="22deg" interpolation-decay="140"
      tone-mapping="neutral" exposure="1" shadow-intensity="0.45" shadow-softness="1"><div slot="progress-bar"></div></model-viewer>
  </div>
  <section class="step" id="view" aria-live="polite"></section>
</main>

<script type="module">
import { screen } from "../screen.js";
const $ = (s) => document.querySelector(s);
const s = screen($("#mv"));
s.ready.then(() => $("#stage").classList.add("ready"));
s.preload(["ready", "updating", "sending", "rec", "reminder", "off"]);

const NETS = [["TELUS6946", 4], ["panchonobu", 2], ["TELUS0412", 2], ["SHAW-7A21", 1]];
const HOT = ["Joe’s iPhone 15 Pro", 3];
const S = { step: 0, found: false, pct: 0, signing: false, signedIn: false, net: "TELUS6946", tries: 0, test: false, ok: null,
  hotSeen: false, hotPick: false, hotTest: false, hotOk: false, memo: "idle", recS: 0 };
const T = [];
const later = (ms, f) => T.push(setTimeout(f, ms));
const clear = () => T.splice(0).forEach(clearTimeout);
const loader = `<span class="loader"><i></i><i></i><i></i></span>`;
const check = `<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const G = `<svg viewBox="0 0 18 18"><path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.7H9v3.3h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z"/><path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.9 10.7a5.4 5.4 0 0 1 0-3.4V5H.9a9 9 0 0 0 0 8z"/><path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.5 1.4l2.6-2.6A9 9 0 0 0 .9 5l3 2.3C4.6 5.2 6.6 3.6 9 3.6z"/></svg>`;
const KEY = `<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="9" r="3.2"/><path d="M9.2 9H16M13.5 9v2.6M15.5 9v1.8"/></svg>`;
const sig = (n) => `<span class="sig s${n}"><i></i><i></i><i></i><i></i></span>`;

// what the e-paper shows: the firmware's real frames (site/assets/bolt)
function frame() {
  if (S.step === 0) return "off";
  if (S.step === 1) return S.pct < 100 ? "updating" : "ready";
  if (S.step === 2) return S.test ? "sending" : "ready";
  if (S.step === 3) return S.hotTest ? "sending" : "ready";
  if (S.step === 4) return S.memo === "rec" ? "rec" : S.memo === "send" ? "sending" : S.memo === "done" ? "reminder" : "ready";
  return "ready";
}
let shown = "";
function device() {
  const f = frame();
  if (f === "rec") return s.show("rec", S.recS);
  if (f !== shown) { shown = f; s.show(f, { flash: true }); }
}

function list(nets, picked, which) {
  return `<div class="card"><ul class="nets">${nets.map(([n, q]) => `<li><button class="net" role="radio" aria-checked="${n === picked}" data-net="${n}"><span class="name">${n}</span>${sig(q)}</button>${n === picked ? pwRow(which) : ""}</li>`).join("")}</ul></div>`;
}
function pwRow(which) {
  const bad = which === "wifi" && S.ok === false;
  return `<div class="pwrow"><input class="pw ${bad ? "bad" : ""}" id="pw-${which}" type="password" placeholder="Password" autocomplete="off">
    ${bad ? `<p class="err">Wrong password</p>` : ""}
    ${which === "wifi" ? `<button class="mini" data-act="keychain">Use the password saved on this Mac</button>` : ""}</div>`;
}
const busy = (on, label) => on ? `<button class="btn busy" disabled style="opacity:1">${loader}</button>` : label;

const V = [
  () => S.found
    ? `<h1>Found your paperbot</h1><button class="btn" data-act="install">Install</button>`
    : `<h1>Plug in your paperbot</h1>
       ${$("#opt-asleep").checked ? `<ul class="tips"><li>Press ⏻</li><li>Unplug it and plug it back in</li><li>Try another cable</li></ul>` : `<p class="sub">Use a USB-C cable.</p>`}
       <span class="waiting">${loader}</span><button class="link" data-act="found">(mock) board appears</button>`,
  () => {
    const done = S.pct >= 100;
    return `<h1>${done ? "Installed" : "Installing"}</h1><div class="track"><i style="width:${S.pct}%"></i></div>
      ${S.signedIn ? `<p class="sub">Signed in as joe@…</p><button class="btn" data-act="next" ${done ? "" : "disabled"}>Continue</button>`
        : S.signing ? `<span class="waiting">${loader}</span>`
        : `<p class="sub">Sign in while it installs.</p><button class="btn light" data-act="signin">${G} Continue with Google</button><button class="btn light" data-act="signin">${KEY} Use a passkey</button>`}`;
  },
  () => S.ok
    ? `<h1>Connected</h1><p class="ok">${check}${S.net}</p><button class="btn" data-act="next">Continue</button>`
    : `<h1>Choose your Wi-Fi</h1>${list(NETS, S.net, "wifi")}${busy(S.test, `<button class="btn" data-act="test">Connect</button>`)}`,
  () => S.hotOk
    ? `<h1>Connected</h1><p class="ok">${check}${HOT[0]}</p><button class="btn" data-act="next">Continue</button>`
    : `<h1>Add your phone’s hotspot</h1><p class="sub">So it works away from home. Turn your hotspot on.</p>
       ${S.hotSeen ? list([HOT, NETS[1]], S.hotPick ? HOT[0] : "", "hot") + busy(S.hotTest, `<button class="btn" data-act="hot-test" ${S.hotPick ? "" : "disabled"}>Connect</button>`)
         : `<span class="waiting">${loader}</span><button class="link" data-act="hot-appear">(mock) hotspot appears</button>`}
       <button class="link" data-act="next">Skip</button>`,
  () => S.memo === "done"
    ? `<h1>It works</h1>
       <div class="card memo"><div class="kind"><svg viewBox="0 0 24 24"><path d="M12 8v4l3 2M21 13a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM3 3 1 5M21 3l2 2"/></svg>Reminder<time>Oct 18, 9:00</time></div><h3>Call the dentist</h3></div>
       <button class="btn" data-act="next">Continue</button>`
    : `<h1>Hold ☀ and say</h1><p class="say">“Remind me to call the dentist on the 18th at 9.”</p>
       ${S.memo === "idle" ? `<button class="link" data-act="memo">(mock) hold ☀</button>` : `<span class="waiting">${loader}</span>`}
       <button class="link" data-act="next">Skip</button>`,
  () => `<h1>All set</h1><p class="sub">Unplug it. It’s yours.</p><a class="btn" href="#" onclick="return false">Open my memos</a>`,
];

function render() {
  $("#dots").innerHTML = V.map((_, i) => `<i class="${i === S.step ? "on" : i < S.step ? "done" : ""}"></i>`).join("");
  $("#jump").innerHTML = V.map((_, i) => `<button data-go="${i}" aria-pressed="${i === S.step}">${i + 1}</button>`).join(" ");
  $("#view").innerHTML = V[S.step]();
  device();
}
function go(i) {
  clear(); S.step = i;
  if (i === 0) { S.found = false; if (!$("#opt-asleep").checked) later(1600, () => { S.found = true; render(); }); }
  if (i === 1 && S.pct < 100) tick();
  if (i > 1) { S.pct = 100; S.signedIn = true; }
  if (i === 2) { S.ok = null; S.tries = 0; S.test = false; }
  if (i === 3) { S.hotSeen = false; S.hotPick = false; S.hotOk = false; later(2200, () => { S.hotSeen = true; render(); }); }
  if (i === 4) S.memo = "idle";
  render();
}
function tick() { later(250, () => { if (S.step !== 1) return; S.pct = Math.min(100, S.pct + 4); render(); if (S.pct < 100) tick(); }); }

document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-go]"); if (g) return go(+g.dataset.go);
  const n = e.target.closest("[data-net]");
  if (n) {
    if (S.step === 2 && !S.test) { S.net = n.dataset.net; S.ok = null; S.tries = 0; render(); $("#pw-wifi")?.focus(); }
    if (S.step === 3 && n.dataset.net === HOT[0]) { S.hotPick = true; render(); $("#pw-hot")?.focus(); }
    return;
  }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "found") { S.found = true; render(); }
  if (act === "install") { S.step = 1; S.pct = 0; render(); tick(); }
  if (act === "signin") { S.signing = true; render(); later(1300, () => { S.signing = false; S.signedIn = true; render(); }); }
  if (act === "next") go(S.step + 1);
  if (act === "keychain") { a.textContent = "macOS will ask for your Mac password…"; later(1500, () => { const i = $("#pw-wifi"); if (i) i.value = "••••••••••••"; a.textContent = "Filled in from this Mac"; }); }
  if (act === "test") { S.test = true; render(); later(2200, () => { S.test = false; S.tries++; S.ok = !($("#opt-wrong").checked && S.tries === 1); render(); }); }
  if (act === "hot-appear") { S.hotSeen = true; render(); }
  if (act === "hot-test") { S.hotTest = true; render(); later(2200, () => { S.hotTest = false; S.hotOk = true; render(); }); }
  if (act === "memo") {
    S.memo = "rec"; S.recS = 0; render();
    const rec = (k) => later(1000, () => { S.recS = k; device(); if (k < 3) rec(k + 1); else { S.memo = "send"; render(); later(1800, () => { S.memo = "done"; render(); }); } });
    rec(1);
  }
});
$("#opt-asleep").addEventListener("change", () => go(0));
go(0);
</script>
</body>
</html>
