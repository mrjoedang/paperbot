<div class="layout">

      </button>
      <div class="bot-info">
        <p class="status" id="say" aria-live="polite"></p>

        <div class="dev-alerts" id="dev-alerts"></div>
        <button class="link-btn" id="open-health" type="button">health &amp; logs →</button>
      </div>
    </section>
    <section class="budget" aria-labelledby="bud-h">

      <div class="meter" id="bud-meter" role="meter" aria-valuemin="0"><span class="fill"></span><span class="reserve"></span></div>
    </section>
  </div></details>

    <div id="sections" aria-live="off"></div>

</div>

  </div>
  <footer class="filter-footer"><button id="filter-reset" class="btn" type="button">Reset</button><button id="filter-apply" class="btn primary" type="button">Show items</button></footer>
</dialog>

</dialog>
